<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Longreach Airport – Flight schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Colour themes. "Outback sunset" is the default; the others are picked with the Theme button or in Edit schedule.
   The board stays in the chosen theme whatever the laptop's own light or dark setting is. */
:root {
  --bg: #f5f5f5; --panel: #ffffff; --row: #ffffff; --row-alt: #fbf6f4;
  --ink: #262626; --muted: #6b6b6b; --title: #b02f26;
  --brand: #d2492a; --brand-ink: #ffffff; --brand-soft: #fdebe5; --brand-soft-ink: #a82d24;
  --today: #ffcf4a; --today-ink: #2a1a0c; --today-muted: rgba(42, 26, 12, 0.55); --today-rule: rgba(42, 26, 12, 0.18);
  --rule: #ebe4e1; --field: #ffffff;
  /* Arrivals panel colours (Departures use --brand) */
  --arr: #1f6fbf; --arr-ink: #ffffff; --arr-soft: #e2edf9; --arr-soft-ink: #175594;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="sky"] {
  --bg: #f1f5fa; --panel: #ffffff; --row: #ffffff; --row-alt: #f3f7fc;
  --ink: #1e2935; --muted: #5d6977; --title: #1a5aa0;
  --brand: #1f6fbf; --brand-ink: #ffffff; --brand-soft: #e2edf9; --brand-soft-ink: #175594;
  --today: #ffcf4a; --today-ink: #1f1a0c; --today-muted: rgba(31, 26, 12, 0.55); --today-rule: rgba(31, 26, 12, 0.18);
  --rule: #dde5ee; --field: #ffffff; color-scheme: light;
  --arr: #d2492a; --arr-ink: #ffffff; --arr-soft: #fdebe5; --arr-soft-ink: #a82d24;
}
:root[data-theme="eucalyptus"] {
  --bg: #f2f5f2; --panel: #ffffff; --row: #ffffff; --row-alt: #f3f8f4;
  --ink: #1f2a24; --muted: #5b6961; --title: #25664a;
  --brand: #2e7d5b; --brand-ink: #ffffff; --brand-soft: #e1efe6; --brand-soft-ink: #215f45;
  --today: #ffcf4a; --today-ink: #1f1a0c; --today-muted: rgba(31, 26, 12, 0.55); --today-rule: rgba(31, 26, 12, 0.18);
  --rule: #dce5df; --field: #ffffff; color-scheme: light;
  --arr: #a8521a; --arr-ink: #ffffff; --arr-soft: #fbeadc; --arr-soft-ink: #8f4515;
}
:root[data-theme="maroon"] {
  --bg: #f5f3f2; --panel: #ffffff; --row: #ffffff; --row-alt: #faf5f4;
  --ink: #2a1513; --muted: #6e625c; --title: #79221f;
  --brand: #8a2a24; --brand-ink: #ffffff; --brand-soft: #f5e5e2; --brand-soft-ink: #79221f;
  --today: #f6a96f; --today-ink: #2a1513; --today-muted: rgba(42, 21, 19, 0.55); --today-rule: rgba(42, 21, 19, 0.18);
  --rule: #e9dfdc; --field: #ffffff; color-scheme: light;
  --arr: #2f6f8f; --arr-ink: #ffffff; --arr-soft: #e1eef4; --arr-soft-ink: #24586f;
}
:root[data-theme="night"] {
  --bg: #1c1c1e; --panel: #262628; --row: #262628; --row-alt: #2e2e31;
  --ink: #f5f5f5; --muted: #b0b0b0; --title: #ff8a63;
  --brand: #d2492a; --brand-ink: #ffffff; --brand-soft: #3f2c27; --brand-soft-ink: #ffc9b8;
  --today: #ffcf4a; --today-ink: #1f1a0c; --today-muted: rgba(31, 26, 12, 0.55); --today-rule: rgba(31, 26, 12, 0.18);
  --rule: #3d3d40; --field: #333336; color-scheme: dark;
  --arr: #2f7fd0; --arr-ink: #ffffff; --arr-soft: #24344a; --arr-soft-ink: #b9d6f5;
}
:root[data-theme="contrast"] {
  --bg: #000000; --panel: #000000; --row: #000000; --row-alt: #151515;
  --ink: #ffffff; --muted: #d6d6d6; --title: #ffd400;
  --brand: #ffd400; --brand-ink: #000000; --brand-soft: #262626; --brand-soft-ink: #ffd400;
  --today: #ffffff; --today-ink: #000000; --today-muted: rgba(0, 0, 0, 0.6); --today-rule: rgba(0, 0, 0, 0.3);
  --rule: #4a4a4a; --field: #111111; color-scheme: dark;
  --arr: #00d4ff; --arr-ink: #000000; --arr-soft: #262626; --arr-soft-ink: #00d4ff;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: "Public Sans", "Segoe UI", Arial, Helvetica, sans-serif;
  overflow: hidden;
}
.board {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 2.2vh 3.5vw;
  gap: 1.6vh;
}

/* Header */
header {
  display: flex; justify-content: space-between; align-items: center; gap: 3vw;
  border-bottom: 0.5vh solid var(--brand); padding-bottom: 1.4vh;
}
.brand { display: flex; align-items: center; gap: 2.2vw; min-width: 0; }
.logo {
  display: block; height: clamp(48px, 9vh, 160px); width: auto;
  background: #ffffff; border-radius: 0.6vw; padding: 1vh 1.2vw;
}
#title { font-size: clamp(22px, 3.6vw, 104px); font-weight: 700; line-height: 1.05; margin: 0; color: var(--title); }
.clock { text-align: right; white-space: nowrap; }
#time { font-size: clamp(24px, 3.6vw, 104px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
#date { font-size: clamp(14px, 1.4vw, 40px); color: var(--muted); margin-top: 0.6vh; }

/* Departures and arrivals panels */
#routes {
  display: grid;
  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  gap: 2vw;
  min-height: 0;
}
.route.arr {
  --brand: var(--arr); --brand-ink: var(--arr-ink);
  --brand-soft: var(--arr-soft); --brand-soft-ink: var(--arr-soft-ink);
}
.route {
  container-type: inline-size;
  min-height: 0;
  display: flex; flex-direction: column;
  border-radius: 1vw; overflow: hidden;
  border: 1px solid var(--rule); background: var(--panel);
}
.route h2 {
  margin: 0; padding: 1vh 2.4cqw 0.8vh;
  display: flex; align-items: center; gap: 0.35em;
  font-size: calc(clamp(18px, 4.6cqw, 68px) * var(--fit, 1)); font-weight: 700; line-height: 1.1;
}
.route h2::before {
  content: ""; flex: none; width: 0.26em; height: 0.85em;
  border-radius: 0.13em; background: var(--brand);
}
.route table { width: 100%; flex: 1; border-collapse: collapse; table-layout: fixed; }
.route col.c-day { width: 24%; }
.route thead th {
  background: var(--brand); color: var(--brand-ink);
  text-align: left; font-weight: 700; line-height: 1.15;
  padding: 0.9vh 2.2cqw;
}
.route thead th.day { font-size: calc(clamp(16px, 4.2cqw, 62px) * var(--fit, 1)); vertical-align: middle; }
.route thead th.grp { font-size: calc(clamp(14px, 3.7cqw, 54px) * var(--fit, 1)); vertical-align: top; border-left: 2px solid rgba(255, 255, 255, 0.22); }
.route thead th.grp .city { display: block; }
.route thead th.grp .airline { display: block; font-weight: 400; font-size: 0.6em; opacity: 0.88; margin-top: 0.15em; }
.plate {
  display: inline-flex; align-items: center; max-width: 100%;
  margin-top: 0.3em; padding: 0.16em 0.4em;
  background: #ffffff; border-radius: 0.22em;
}
.plate img { display: block; height: calc(clamp(16px, 4.4cqw, 64px) * var(--fit, 1)); width: auto; max-width: 100%; object-fit: contain; }
.route thead th.sub {
  background: var(--brand-soft); color: var(--brand-soft-ink);
  font-size: calc(clamp(12px, 2.7cqw, 40px) * var(--fit, 1)); padding: 0.7vh 2.2cqw;
}
.route .gstart { border-left: 2px solid var(--rule); }
.route tbody td {
  font-size: calc(clamp(15px, 4.5cqw, 66px) * var(--fit, 1));
  padding: 0.1vh 2.2cqw;
  font-variant-numeric: tabular-nums;
  border-top: 1px solid var(--rule);
  white-space: nowrap; overflow: hidden;
}
.route tbody tr:nth-child(odd) td { background: var(--row); }
.route tbody tr:nth-child(even) td { background: var(--row-alt); }
.route tbody td.nf { color: var(--muted); }
/* Flight status: a delayed flight's new time is highlighted in red */
.route tbody td .t { display: inline-block; }
.route tbody td .t.changed {
  background: #d32f2f; color: #ffffff; font-weight: 700;
  padding: 0 0.2em; margin-left: -0.2em; border-radius: 0.14em;
}
.status {
  display: block; width: max-content; margin-top: 0.15em;
  font-size: calc(clamp(10px, 2.1cqw, 32px) * var(--fit, 1)); font-weight: 700; line-height: 1.2;
  padding: 0.1em 0.55em; border-radius: 999px; color: #ffffff;
}
.status.ok { background: #1e7a3c; }
.status.late { background: #d32f2f; }
.daycell .dname { display: block; font-weight: 700; line-height: 1.05; }
.daycell .dsub {
  display: flex; align-items: center; gap: 0.5em; margin-top: 0.12em;
  font-size: calc(clamp(11px, 2.6cqw, 38px) * var(--fit, 1)); color: var(--muted); line-height: 1.2;
}
.tag { font-size: 0.8em; line-height: 1.15; padding: 0.08em 0.5em; border: 2px solid currentColor; border-radius: 999px; }
.route tbody tr.today td { background: var(--today); color: var(--today-ink); font-weight: 700; }
.route tbody tr.today .dsub { color: var(--today-ink); }
.route tbody tr.today td.nf { color: var(--today-muted); }
.route tbody tr.today td.gstart { border-left-color: var(--today-rule); }
.empty { margin: auto; color: var(--muted); font-size: clamp(16px, 2vw, 48px); text-align: center; }

/* Message strip */
.strip {
  display: flex; align-items: center; gap: 2vw;
  background: var(--brand); color: var(--brand-ink);
  border-radius: 1vw; padding: 1.5vh 2vw;
}
#headline { font-size: clamp(18px, 2.1vw, 60px); font-weight: 700; margin: 0; white-space: nowrap; }
#message { font-size: clamp(14px, 1.5vw, 44px); margin: 0; line-height: 1.3; }
#message:empty, #headline:empty, #stamp:empty { display: none; }
#stamp { margin: 0 0 0 auto; font-size: clamp(12px, 1.05vw, 30px); opacity: 0.85; white-space: nowrap; }

/* Controls */
.controls {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px; padding: 6px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--rule); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
  transition: opacity .3s; z-index: 20;
}
.controls.hidden { opacity: 0; pointer-events: none; }
button {
  font: 700 15px/1 "Public Sans", "Segoe UI", Arial, sans-serif;
  padding: 10px 14px; border-radius: 8px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer;
}
button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
button.danger { color: #b3261e; }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.toast {
  position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  background: var(--ink); color: var(--bg);
  font-size: clamp(15px, 1.4vw, 36px); font-weight: 700;
  padding: 0.6em 1.1em; border-radius: 999px;
  opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 40;
}
.toast.show { opacity: 1; }
/* Small version label in the bottom-left corner. Change the number in the HTML when the board is updated. */
.version {
  position: fixed; left: 6px; bottom: calc(3px + env(safe-area-inset-bottom, 0px));
  font-size: 10px; line-height: 1; color: var(--muted); opacity: 0.6;
  pointer-events: none; z-index: 5;
}

/* Edit panel */
.editor {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(560px, 100%);
  background: var(--panel); color: var(--ink);
  border-left: 1px solid var(--rule);
  box-shadow: -8px 0 30px rgba(0,0,0,.25);
  transform: translateX(100%); transition: transform .25s ease;
  z-index: 30; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.editor.open { transform: none; }
.editor-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-bottom: 1px solid var(--rule);
}
.editor-head h2 { margin: 0; font-size: 20px; }
.head-actions { display: flex; gap: 8px; }
.editor .intro { margin: 0 0 16px; padding: 10px 12px; border-radius: 8px; background: var(--brand-soft); color: var(--ink); line-height: 1.4; }
.editor-body { overflow-y: auto; padding: 16px 20px 32px; flex: 1; font-size: 15px; }
.editor fieldset {
  border: 1px solid var(--rule); border-radius: 10px;
  padding: 14px 16px 16px; margin: 0 0 18px;
}
.editor legend { font-weight: 700; font-size: 16px; padding: 0 6px; }
.editor label { display: block; font-weight: 700; margin: 10px 0 4px; }
.editor input[type="text"], .editor select {
  width: 100%; font: inherit; font-size: 16px;
  padding: 9px 10px; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--field); color: var(--ink);
}
.editor input[type="file"] { font: inherit; font-size: 14px; max-width: 100%; }
.editor .tip { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; line-height: 1.4; }
.logo-prev {
  display: flex; align-items: center; min-height: 52px; margin: 6px 0 8px;
  padding: 8px 10px; border: 1px dashed var(--rule); border-radius: 8px; background: #ffffff;
}
.logo-prev img { display: block; max-height: 40px; max-width: 100%; }
.logo-prev .tip { color: #6b6b6b; margin: 0; }
.logo-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.times { width: 100%; border-collapse: collapse; margin-top: 10px; }
.times th { text-align: left; font-size: 13.5px; color: var(--muted); padding: 4px 6px; }
.times td { padding: 4px 6px; }
.times td:first-child { font-weight: 700; width: 62px; white-space: nowrap; }
.times input[type="text"] { padding: 7px 8px; font-variant-numeric: tabular-nums; }
.times select { padding: 7px 6px; font-size: 15px; min-width: 100px; }
.times tr.delayrow td { padding-top: 0; }
.times tr.delayrow td:first-child { font-weight: 400; color: #d32f2f; text-align: right; font-size: 13.5px; }
.times tr.delayrow input[type="text"] { border-color: #d32f2f; }
.times input.bad { border-color: #b3261e; }
.row-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.editor-foot { display: flex; gap: 8px; flex-wrap: wrap; }

@media (max-width: 760px) {
  body { overflow: auto; }
  .board { height: auto; min-height: 100%; }
  #routes { grid-template-columns: 1fr; }
  header { flex-direction: column; align-items: flex-start; }
  .brand { flex-wrap: wrap; }
  .clock { text-align: left; }
  .route tbody td { padding: 1.2vh 2.2cqw; }
  .strip { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  .controls, .editor, .toast { transition: none; }
}
</style>
</head>

  /* ---------- Publishing to GitHub ----------
     "Publish to TV" takes index.html from the GitHub repository, writes the current schedule
     (times, statuses, delays, messages, theme) into its board-data block, and uploads it.
     The token stays in this browser only, under the same key as before. */
  var CFG_KEY = "lre-flight-board-publish";
  var DATA_RE = /(<script id="board-data" type="application\/json">)[\s\S]*?(<\/script>)/;
  function loadCfg() {
    var d = { owner: "JHU-QAL", repo: "lre-flights", token: "" };
    try { var raw = localStorage.getItem(CFG_KEY); if (raw) { var c = JSON.parse(raw); for (var k in c) d[k] = c[k]; } } catch (e) {}
    return d;
  }
  function saveCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {} }
  function apiUrl(c) { return "https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo) + "/contents/index.html"; }
  function ghHeaders(c) { return { "Authorization": "Bearer " + c.token, "Accept": "application/vnd.github+json" }; }
  function ghGet(c) {
    if (!c.token) return Promise.reject(new Error("This computer isn’t set up to publish yet. Ask your admin."));
    return fetch(apiUrl(c) + "?t=" + Date.now(), { headers: ghHeaders(c), cache: "no-store" }).then(function (r) {
      if (r.status === 401) throw new Error("The access token isn’t valid or has expired. Ask your admin.");
      if (r.status === 403 || r.status === 404) throw new Error("Can’t reach the board on GitHub. Ask your admin to check the setup.");
      if (!r.ok) throw new Error("GitHub error (" + r.status + "). Please try again.");
      return r.json();
    }, function () { throw new Error("Can’t connect to GitHub. Check the internet connection and try again."); });
  }
  function toB64(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function fromB64(b) {
    var bin = atob(String(b || "").replace(/\s/g, "")), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function withData(html) {
    if (!DATA_RE.test(html)) return null;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return html.replace(DATA_RE, function (m, a, b) { return a + json + b; });
  }
  var publishing = false;
  function publish() {
    if (publishing) return;
    var bad = editor.querySelectorAll("input.bad");
    if (bad.length) { toast("Please fix the times marked in red first.", 5000); bad[0].focus(); return; }
    var c = loadCfg(), btn = document.getElementById("publishBtn");
    publishing = true; btn.textContent = "Publishing…"; btn.disabled = true;
    if (!state.updated) state.updated = Date.now();
    save();
    ghGet(c).then(function (cur) {
      var html = withData(fromB64(cur.content));
      if (!html) throw new Error("The file on GitHub is an older version. Ask your admin to upload the latest index.html.");
      return fetch(apiUrl(c), {
        method: "PUT",
        headers: ghHeaders(c),
        body: JSON.stringify({ message: "Update flight schedule", content: toB64(html), sha: cur.sha })
      }).then(function (r) {
        if (r.status === 409) throw new Error("Someone else published at the same time. Please click Publish to TV again.");
        if (!r.ok) throw new Error("Couldn’t publish (" + r.status + "). Please try again.");
      }, function () { throw new Error("Can’t connect to GitHub. Check the internet connection and try again."); });
    }).then(function () {
      toast("Published. The TV will update within about 5 minutes.", 7000);
    }).catch(function (e) {
      toast(e.message, 8000);
    }).then(function () {
      publishing = false; btn.textContent = "Publish to TV"; btn.disabled = false;
    });
  }
  function saveBackup() {
    fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(); return r.text(); })
      .then(function (txt) {
        var html = withData(txt);
        if (!html) throw new Error();
        var a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        a.download = "index.html";
        document.body.appendChild(a); a.click(); a.remove();
        toast("Backup saved.", 4000);
      })
      .catch(function () { toast("Backup only works from the website address.", 5000); });
  }

  /* ---------- TV auto-update ----------
     When the board is opened from the website, it checks every 2 minutes for a newer published
     schedule and switches to it. If the internet drops, it keeps showing what it has. */
  function readBoardData(text) {
    try {
      var d = JSON.parse(text);
      return d && Array.isArray(d.routes) ? cleanState(d) : null;
    } catch (e) { return null; }
  }
  function checkForUpdate() {
    if (!/^https?:$/.test(location.protocol)) return;
    if (editor.classList.contains("open")) return;
    fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (txt) {
        var m = txt && txt.match(DATA_RE);
        if (!m) return;
        var data = readBoardData(txt.slice(txt.indexOf(m[1]) + m[1].length, txt.indexOf(m[2], txt.indexOf(m[1]))));
        if (data && (data.updated || 0) > (state.updated || 0)) {
          state = data; save(); renderBoard();
        }
      })
      .catch(function () {});
  }

  function update() { state.updated = Date.now(); save(); renderBoard(); }

  var editor = document.getElementById("editor");
  function openEditor(on) {
    editor.classList.toggle("open", on);
    editor.setAttribute("aria-hidden", on ? "false" : "true");
    if (on) { renderEditor(); setTimeout(function () { var f = editor.querySelector("select, input"); if (f) f.focus(); }, 50); }
    showControls();
  }
  document.getElementById("editBtn").addEventListener("click", function () { openEditor(!editor.classList.contains("open")); });
  document.getElementById("doneBtn").addEventListener("click", function () { openEditor(false); });
  document.getElementById("publishBtn").addEventListener("click", publish);

  function nextTheme() {
    var i = 0;
    for (var k = 0; k < THEMES.length; k++) if (THEMES[k][0] === state.look) i = k;
    state.look = THEMES[(i + 1) % THEMES.length][0];
    update();
    toast("Theme: " + labelOf(THEMES, state.look));
    if (editor.classList.contains("open")) renderEditor();
  }
  document.getElementById("themeBtn").addEventListener("click", nextTheme);
  function toggleFs() {
    try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) {}
  }
  document.getElementById("fsBtn").addEventListener("click", toggleFs);
  document.addEventListener("keydown", function (e) {
    var tag = e.target.tagName;
    if (tag === "INPUT" || tag === "SELECT") { if (e.key === "Escape") openEditor(false); return; }
    if (e.key === "e" || e.key === "E") openEditor(!editor.classList.contains("open"));
    if (e.key === "f" || e.key === "F") toggleFs();
    if (e.key === "t" || e.key === "T") nextTheme();
    if (e.key === "Escape") openEditor(false);
  });

  var controls = document.getElementById("controls");
  var idleTimer;
  function showControls() {
    controls.classList.remove("hidden");
    document.body.style.cursor = "";
    clearTimeout(idleTimer);
    if (!editor.classList.contains("open")) {
      idleTimer = setTimeout(function () { controls.classList.add("hidden"); document.body.style.cursor = "none"; }, 3000);
    }
  }
  ["mousemove", "mousedown", "touchstart", "keydown"].forEach(function (ev) {
    document.addEventListener(ev, showControls, { passive: true });
  });

  var timeEl = document.getElementById("time"), dateEl = document.getElementById("date"), lastDay = "";
  function tick() {
    var now = new Date();
    timeEl.textContent = now.toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit", hour12: false });
    var d = now.toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    dateEl.textContent = d;
    if (d !== lastDay) {
      lastDay = d;
      /* New day: clear yesterday's On time / Delayed so it goes back to the normal schedule */
      state.routes.forEach(function (r) { r.status = cleanStatus(r.status); });
      save();
      renderBoard();
      if (editor.classList.contains("open")) renderEditor();
    }
  }

  state = load();
  var published = readBoardData(document.getElementById("board-data").textContent);
  if (published && (published.updated || 0) > (state.updated || 0)) { state = published; save(); }
  renderBoard();
  tick();
  setInterval(tick, 1000);
  setInterval(checkForUpdate, 2 * 60 * 1000);
  setTimeout(checkForUpdate, 5000);
  showControls();
})();
</script>
</body>
</html>
